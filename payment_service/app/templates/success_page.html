<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(213,166,91,.2), transparent 30%),
                radial-gradient(circle at 85% 85%, rgba(180,70,110,.16), transparent 30%),
                linear-gradient(135deg, #24191f, #39252c, #21191e);
            color: #fff;
            padding: 40px 20px;
            display: flex;
            align-items: center;
        }

        .page {
            width: 650px;
            max-width: 100%;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand {
            color: #d5a65b;
            font-family: Georgia, serif;
            letter-spacing: 3px;
            font-size: 11px;
        }

        .card {
            background: rgba(39,32,38,.96);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 18px;
            padding: 45px 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,.4);
            text-align: center;
        }

        .icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 25px;
            border-radius: 50%;
            border: 1px solid #65b878;
            color: #65b878;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .header-label {
            color: #65b878;
            font-size: 9px;
            letter-spacing: 3px;
            margin-bottom: 9px;
        }

        h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 30px;
            font-weight: normal;
        }

        .description {
            color: #999;
            font-size: 12px;
            line-height: 1.7;
            margin: 12px auto 0;
            max-width: 430px;
        }

        .order {
            margin-top: 30px;
            padding: 18px;
            border-radius: 12px;
            background: rgba(255,255,255,.025);
            border: 1px solid #40383e;
        }

        .order-label {
            color: #888;
            font-size: 9px;
            letter-spacing: 2px;
            margin-bottom: 7px;
        }

        .order-number {
            color: #fff;
            font-family: Georgia, serif;
            font-size: 17px;
        }

        .status {
            margin-top: 14px;
            color: #65b878;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .bottom {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #40383e;
        }

        .save {
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            background: #d5a65b;
            color: #211a15;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: .2s;
        }

        .save:hover {
            background: #e5b970;
        }

        @media (max-width: 700px) {
            .card {
                padding: 35px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="top">
            <div class="brand">TBILISI BAR</div>
        </div>

        <div class="card">
            <div class="icon">✓</div>

            <div class="header-label">PAYMENT CONFIRMED</div>

            <h1>Thank you for your order</h1>

            <div class="description">
                Your payment has been successfully processed.
                We have received your order and will start preparing it shortly.
            </div>

            <div class="order">
                <div class="order-label">ORDER</div>
                <div class="order-number">#{{ order_number }}</div>
                <div class="status">PAID</div>
            </div>

            <div class="bottom">
                <a href="/user/my_profile" class="save">BACK TO MENU</a>
            </div>
        </div>
    </div>
</body>
</html>
