<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Меню — BAR</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #101012;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;

            background:
                linear-gradient(
                    rgba(10, 10, 12, .91),
                    rgba(10, 10, 12, .96)
                ),
                url("https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=2000&q=70");

            background-size: cover;
            background-position: center;

            filter: blur(3px);
            transform: scale(1.02);
        }

        .container {
            max-width: 1150px;
            margin: auto;
            padding: 40px 30px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 45px;
        }

        .back {
            color: #88888d;
            text-decoration: none;
            font-size: 12px;
            transition: .2s;
        }

        .back:hover {
            color: #d5a65b;
        }

        .brand {
            color: #55555a;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header span {
            color: #d5a65b;
            font-size: 9px;
            letter-spacing: 3px;
        }

        .header h1 {
            margin-top: 8px;

            font-family: Georgia, serif;
            font-size: 38px;
            font-weight: normal;
        }

        .header p {
            margin-top: 8px;
            color: #77777d;
            font-size: 11px;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 7px;

            margin-bottom: 25px;
        }

        .filter {
            padding: 8px 14px;

            color: #77777d;
            background: rgba(25, 25, 28, .9);

            border: 1px solid #29292d;
            border-radius: 6px;

            text-decoration: none;
            font-size: 10px;

            transition: .2s;
        }

        .filter:hover,
        .filter.active {
            color: #111;
            background: #d5a65b;
            border-color: #d5a65b;
        }

        .menu-list {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 16px;
        }

        .dish {
            overflow: hidden;

            background: rgba(25, 25, 28, .92);

            border: 1px solid #29292d;
            border-radius: 11px;

            transition: .2s;
        }

        .dish:hover {
            border-color: rgba(213, 166, 91, .6);
            transform: translateY(-2px);
        }

        .dish img {
            width: 100%;
            height: 180px;

            object-fit: cover;
            display: block;
        }

        .dish-content {
            padding: 15px;
        }

        .category {
            color: #d5a65b;

            font-size: 8px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .dish h2 {
            margin-top: 6px;

            font-family: Georgia, serif;
            font-size: 17px;
            font-weight: normal;
        }

        .description {
            margin-top: 7px;

            color: #77777d;

            font-size: 10px;
            line-height: 1.5;
        }

        .dish-bottom {
            display: flex;
            align-items: center;
            justify-content: flex-end;

            margin-top: 14px;
            padding-top: 12px;

            border-top: 1px solid #29292d;
        }

        .price {
            color: #d5a65b;

            font-size: 13px;
            font-weight: bold;
        }

        @media (max-width: 850px) {
            .menu-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 15px;
            }

            .menu-list {
                grid-template-columns: 1fr;
            }

            .filters {
                overflow-x: auto;
                justify-content: flex-start;
            }

            .header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="top">
            <a href="index.html" class="back">← Назад</a>
            <span class="brand">BAR</span>
        </div>

        <header class="header">
            <span>MENU</span>

            <h1>Меню</h1>

            <p>
                Напитки и блюда нашего бара
            </p>
        </header>

        <nav class="filters">
            <a href="#" class="filter active">Все</a>
            <a href="#" class="filter">Коктейли</a>
            <a href="#" class="filter">Блюда</a>
            <a href="#" class="filter">Закуски</a>
        </nav>

        <section class="menu-list">

            {% for dish in dishes %}
                <div class="all_dish">
                    <h3>{{ dish.name }}</h3>
                    <p>{{ dish.price }} €</p>
                </div>
            {% endfor %}

</section>

    </main>

</body>
</html>
