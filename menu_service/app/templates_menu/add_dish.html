<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ trans('add_dish_title') }}</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(145, 85, 75, 0.20) 0%, rgba(55, 35, 40, 0.22) 38%, rgba(9, 9, 11, 1) 78%),
                linear-gradient(180deg, #211a1c 0%, #121214 50%, #09090b 100%);
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .page {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 50px 30px 70px;
        }
        .back {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 35px;
            padding: 8px 12px;
            background: rgba(42, 40, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 6px;
            color: #77777d;
            font-size: 10px;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
        }
        .back-arrow {
            color: #d5a65b;
            font-size: 14px;
            line-height: 1;
            transition: transform 0.2s;
        }
        .back:hover {
            background: rgba(52, 49, 52, 0.9);
            border-color: rgba(213, 166, 91, 0.35);
            color: #ffffff;
        }
        .back:hover .back-arrow {
            transform: translateX(-3px);
            color: #e4b971;
        }
        .back:active {
            transform: translateY(1px);
        }
        .header {
            margin-bottom: 28px;
        }
        .title {
            margin: 0 0 8px;
            font-family: Georgia, serif;
            font-size: 38px;
            font-weight: normal;
            letter-spacing: -0.5px;
        }
        .subtitle {
            margin: 0;
            color: #77777d;
            font-size: 11px;
            line-height: 1.6;
        }
        .card {
            padding: 30px;
            background: rgba(25, 24, 26, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }
        .field {
            margin-bottom: 22px;
        }
        .field:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #c5a69a;
            font-size: 10px;
            letter-spacing: 0.5px;
        }
        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 13px;
            background: rgba(40, 34, 35, 0.9);
            border: 1px solid rgba(180, 100, 90, 0.28);
            border-radius: 7px;
            color: #f0b38a;
            font-family: Arial, sans-serif;
            font-size: 12px;
            outline: none;
            transition: background 0.2s, border-color 0.2s;
        }
        input:hover,
        textarea:hover,
        select:hover {
            background: rgba(48, 39, 40, 0.95);
            border-color: rgba(180, 100, 90, 0.45);
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: rgba(213, 166, 91, 0.65);
        }
        input::placeholder,
        textarea::placeholder {
            color: #68666a;
        }
        textarea {
            min-height: 110px;
            resize: vertical;
            line-height: 1.5;
        }
        select {
            cursor: pointer;
        }
        select option {
            background: #242123;
            color: #f0b38a;
        }
        .checkbox-field {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(40, 34, 35, 0.55);
            border: 1px solid rgba(180, 100, 90, 0.2);
            border-radius: 8px;
        }
        .checkbox-field input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 2px 0 0;
            padding: 0;
            flex-shrink: 0;
            accent-color: #d5a65b;
            cursor: pointer;
        }
        .checkbox-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            cursor: pointer;
        }
        .checkbox-label {
            color: #f0c09d;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.3;
        }
        .checkbox-hint {
            color: #77777d;
            font-size: 10px;
            line-height: 1.5;
        }
        .photo-box {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .photo-preview {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: rgba(35, 33, 35, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #66656a;
            font-size: 10px;
            text-align: center;
        }
        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .photo-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 145px;
            padding: 10px 15px;
            border: 1px solid rgba(213, 166, 91, 0.32);
            border-radius: 7px;
            background: rgba(45, 38, 35, 0.9);
            color: #d5a65b;
            font-size: 10px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .photo-button:hover {
            background: rgba(62, 49, 40, 0.95);
            border-color: rgba(213, 166, 91, 0.6);
            color: #e4b971;
        }
        .photo-button.change {
            display: none;
        }
        .photo-input {
            display: none;
        }
        .form-error {
            display: none;
            margin-bottom: 20px;
            padding: 10px 12px;
            background: rgba(75, 35, 38, 0.45);
            border: 1px solid rgba(200, 90, 95, 0.3);
            border-radius: 6px;
            color: #d98282;
            font-size: 10px;
            line-height: 1.5;
        }
        .field-error {
            margin-top: 6px;
            color: #d98282;
            font-size: 10px;
        }
        .invalid {
            border-color: rgba(210, 90, 95, 0.7) !important;
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 30px;
            padding-top: 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .button {
            padding: 11px 20px;
            border-radius: 7px;
            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .cancel {
            background: rgba(40, 39, 41, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #77777d;
        }
        .cancel:hover {
            background: rgba(52, 50, 53, 0.9);
            color: #ffffff;
        }
        .save {
            background: rgba(175, 132, 73, 0.9);
            border: 1px solid rgba(213, 166, 91, 0.5);
            color: #171412;
        }
        .save:hover {
            background: #d5a65b;
            border-color: #e4b971;
        }
        @media (max-width: 600px) {
            .page {
                padding: 30px 18px 50px;
            }
            .title {
                font-size: 31px;
            }
            .card {
                padding: 22px;
            }
            .photo-box {
                align-items: flex-start;
            }
            .photo-preview {
                width: 85px;
                height: 85px;
            }
            .form-actions {
                flex-direction: column-reverse;
            }
            .button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <a href="/menu_page" class="back">
        <span class="back-arrow">←</span>
        <span>{{ trans('back_to_menu') }}</span>
    </a>

    <div class="header">
        <h1 class="title">{{ trans('add_dish_title') }}</h1>
        <p class="subtitle">{{ trans('add_dish_subtitle') }}</p>
    </div>

    <div class="card">
        <div id="formError" class="form-error"></div>

        <form
            id="dishForm"
            action="/menu_page/add_dish"
            method="POST"
            enctype="multipart/form-data"
        >
            <div class="field">
                <label for="dish_name">{{ trans('dish_name_label') }}</label>
                <input
                    type="text"
                    id="dish_name"
                    name="dish_name"
                    placeholder="{{ trans('dish_name_placeholder') }}"
                    required
                    minlength="2"
                    maxlength="100">
            </div>

            <div class="field">
                <label for="price">{{ trans('price_label') }}</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                    placeholder="0.00"
                    min="0"
                    step="0.01"
                    required>
            </div>

            <div class="field">
                <label for="description">{{ trans('description_label') }}</label>
                <textarea
                    id="description"
                    name="description"
                    placeholder="{{ trans('description_placeholder') }}"
                    maxlength="1000"></textarea>
            </div>

            <div class="field">
                <label for="category_id">{{ trans('category_label') }}</label>
                <select id="category_id" name="category_id" required>
                    <option value="" selected disabled>{{ trans('choose_category') }}</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.category_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label>{{ trans('item_type_label') }}</label>
                <label class="checkbox-field" for="is_drink">
                    <input
                        type="checkbox"
                        id="is_drink"
                        name="is_drink"
                        value="true">
                    <span class="checkbox-text">
                        <span class="checkbox-label">{{ trans('is_drink_label') }}</span>
                        <span class="checkbox-hint">
                            {{ trans('is_drink_hint') }}
                        </span>
                    </span>
                </label>
            </div>

            <div class="field">
                <label>{{ trans('photo_label') }}</label>
                <div class="photo-box">
                    <div class="photo-preview" id="photoPreview">{{ trans('photo_not_selected') }}</div>

                    <div class="photo-actions">
                        <label for="image" class="photo-button" id="attachButton">{{ trans('attach_photo') }}</label>
                        <label for="image" class="photo-button change" id="changeButton">{{ trans('change_photo') }}</label>
                        <input
                            type="file"
                            id="image"
                            name="image"
                            class="photo-input"
                            accept="image/jpeg,image/png,image/webp">
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <a href="/menu_page" class="button cancel">{{ trans('cancel') }}</a>
                <button type="submit" class="button save">{{ trans('add_dish_button') }}</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/api.js"></script>
<script>
const i18n = {
    error_image_only: "{{ trans('error_image_only') | escape }}",
    error_check_form: "{{ trans('error_check_form') | escape }}",
    error_add_dish: "{{ trans('error_add_dish') | escape }}",
    error_connection: "{{ trans('error_connection') | escape }}"
};

const form = document.getElementById("dishForm");
const formError = document.getElementById("formError");
const imageInput = document.getElementById("image");
const photoPreview = document.getElementById("photoPreview");
const attachButton = document.getElementById("attachButton");
const changeButton = document.getElementById("changeButton");

imageInput.addEventListener("change", function() {
    const file = this.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {
        showFormError(i18n.error_image_only);
        this.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {
        photoPreview.innerHTML = "";
        const image = document.createElement("img");
        image.src = event.target.result;
        photoPreview.appendChild(image);
        attachButton.style.display = "none";
        changeButton.style.display = "inline-flex";
    };

    reader.readAsDataURL(file);
});

function showFormError(message) {
    formError.textContent = message;
    formError.style.display = "block";
}

function clearFormError() {
    formError.textContent = "";
    formError.style.display = "none";
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();
    clearFormError();

    const formData = new FormData(form);

    try {
        const response = await apiFetch("/menu_page/add_dish", {
            method: "POST",
            body: formData
        });

        if (response.ok) {
            window.location.href = "/menu_page";
            return;
        }

        const text = await response.text();
        let data;

        try {
            data = JSON.parse(text);
        } catch {
            showFormError(text || i18n.error_add_dish);
            return;
        }

        if (typeof data.detail === "string") {
            showFormError(data.detail);
            return;
        }

        if (Array.isArray(data.detail)) {
            data.detail.forEach(error => {
                const fieldName = error.loc?.at(-1);
                const input = form.querySelector(`[name="${fieldName}"]`);

                if (input) {
                    input.classList.add("invalid");
                }
            });

            showFormError(i18n.error_check_form);
            return;
        }

        showFormError(i18n.error_add_dish);
    } catch (error) {
        console.error(error);
        showFormError(i18n.error_connection);
    }
});

form.querySelectorAll("input, textarea, select").forEach(input => {
    input.addEventListener("input", function() {
        this.classList.remove("invalid");
    });

    input.addEventListener("change", function() {
        this.classList.remove("invalid");
    });
});
</script>
</body>
</html>
