<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Изменение блюда</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(145, 85, 75, 0.20) 0%,
                    rgba(55, 35, 40, 0.22) 38%,
                    rgba(9, 9, 11, 1) 78%
                ),
                linear-gradient(
                    180deg,
                    #211a1c 0%,
                    #121214 50%,
                    #09090b 100%
                );

            color: #ffffff;

            font-family: Arial, sans-serif;
        }

        .page {
            width: 100%;
            max-width: 800px;

            margin: 0 auto;

            padding: 60px 35px;
        }

        /* =========================
           BACK
        ========================= */

        .back {
            display: inline-flex;

            align-items: center;

            gap: 9px;

            padding: 8px 12px;

            background: rgba(42, 40, 42, 0.65);

            border: 1px solid rgba(255, 255, 255, 0.07);

            border-radius: 6px;

            color: #77777d;

            font-size: 10px;

            text-decoration: none;

            transition:
                background 0.2s,
                border-color 0.2s,
                color 0.2s,
                transform 0.15s;
        }

        .back-arrow {
            color: #d5a65b;

            font-size: 14px;

            line-height: 1;
        }

        .back:hover {
            background: rgba(52, 49, 52, 0.9);

            border-color: rgba(213, 166, 91, 0.35);

            color: #ffffff;
        }

        .back:active {
            transform: translateY(1px);
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            margin-top: 35px;

            margin-bottom: 30px;
        }

        .title {
            color: #ffffff;

            font-family: Georgia, serif;

            font-size: 36px;

            font-weight: normal;

            letter-spacing: 2px;
        }

        .subtitle {
            margin-top: 10px;

            color: #77777d;

            font-size: 12px;
        }

        /* =========================
           FORM
        ========================= */

        .form-card {
            padding: 30px;

            background: rgba(27, 25, 27, 0.96);

            border: 1px solid rgba(213, 166, 91, 0.16);

            border-radius: 14px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .field {
            margin-bottom: 22px;
        }

        .field:last-of-type {
            margin-bottom: 0;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #aaa9ae;

            font-size: 10px;

            letter-spacing: 0.5px;
        }

        input,
        textarea {
            width: 100%;

            padding: 12px 13px;

            background: rgba(42, 40, 42, 0.95);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 7px;

            outline: none;

            color: #ffffff;

            font-family: Arial, sans-serif;

            font-size: 11px;

            transition:
                border-color 0.2s,
                background 0.2s;
        }

        input {
            height: 40px;
        }

        textarea {
            min-height: 110px;

            resize: vertical;

            line-height: 1.5;
        }

        input:focus,
        textarea:focus {
            background: rgba(48, 45, 48, 0.98);

            border-color: rgba(213, 166, 91, 0.55);
        }

        input::placeholder,
        textarea::placeholder {
            color: #55555b;
        }

        /* =========================
           PHOTO
        ========================= */

        .photo-section {
            margin-top: 28px;

            padding-top: 25px;

            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .photo-title {
            margin-bottom: 15px;

            color: #aaa9ae;

            font-size: 10px;
        }

        .current-photo {
            display: flex;

            align-items: center;

            gap: 18px;

            margin-bottom: 18px;

            padding: 15px;

            background: rgba(30, 29, 31, 0.97);

            border: 1px solid rgba(255, 255, 255, 0.06);

            border-radius: 9px;
        }

        .current-photo img {
            width: 90px;
            height: 90px;

            object-fit: cover;

            border-radius: 9px;

            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .photo-info {
            color: #77777d;

            font-size: 9px;

            line-height: 1.6;
        }

        .no-current-photo {
            color: #55555b;

            font-size: 9px;

            font-style: italic;
        }

        input[type="file"] {
            height: auto;

            padding: 10px;

            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            margin-right: 10px;

            padding: 7px 10px;

            background: rgba(52, 49, 52, 0.98);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 5px;

            color: #aaa9ae;

            font-size: 9px;

            cursor: pointer;
        }

        input[type="file"]::file-selector-button:hover {
            border-color: #d5a65b;

            color: #ffffff;
        }

        /* =========================
           ACTIONS
        ========================= */

        .form-actions {
            display: flex;

            justify-content: flex-end;

            gap: 8px;

            margin-top: 30px;

            padding-top: 22px;

            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 36px;

            padding: 9px 16px;

            border-radius: 6px;

            font-family: Arial, sans-serif;

            font-size: 9px;

            font-weight: 600;

            text-decoration: none;

            cursor: pointer;

            transition:
                background 0.2s,
                border-color 0.2s,
                color 0.2s;
        }

        .btn.cancel {
            background: rgba(42, 40, 42, 0.95);

            border: 1px solid rgba(255, 255, 255, 0.08);

            color: #77777d;
        }

        .btn.cancel:hover {
            background: rgba(52, 49, 52, 0.98);

            color: #ffffff;

            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn.save {
            background: rgba(213, 166, 91, 0.14);

            border: 1px solid rgba(213, 166, 91, 0.35);

            color: #d5a65b;
        }

        .btn.save:hover {
            background: rgba(213, 166, 91, 0.24);

            border-color: #d5a65b;

            color: #e4b971;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .page {
                padding: 35px 18px;
            }

            .title {
                font-size: 30px;
            }

            .form-card {
                padding: 22px;
            }

            .current-photo {
                align-items: flex-start;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <!-- BACK -->

    <a href="/menu_page" class="back">
        <span class="back-arrow">←</span>
        <span>Вернуться в меню</span>
    </a>


    <!-- HEADER -->

    <header class="header">

        <h1 class="title">
            Изменение блюда
        </h1>

        <div class="subtitle">
            Изменение информации о блюде
        </div>

    </header>


    <!-- FORM -->

    <form
        class="form-card"
        action="/menu_page/edit_dish/{{ dish.id }}"
        method="post"
        enctype="multipart/form-data"
    >

        <!-- NAME -->

        <div class="field">

            <label for="dish_name">
                Название
            </label>

            <input
                type="text"
                id="dish_name"
                name="dish_name"
                value="{{ dish.dish_name }}"
                placeholder="Введите название блюда"
                required
            >

        </div>


        <!-- DESCRIPTION -->

        <div class="field">

            <label for="description">
                Описание
            </label>

            <textarea
                id="description"
                name="description"
                placeholder="Введите описание блюда"
            >{{ dish.description or "" }}</textarea>

        </div>


        <!-- PRICE -->

        <div class="field">

            <label for="price">
                Цена
            </label>

            <input
                type="number"
                id="price"
                name="price"
                value="{{ dish.price }}"
                min="0"
                step="0.01"
                placeholder="0.00"
                required
            >

        </div>


        <!-- PHOTO -->

        <div class="photo-section">

            <div class="photo-title">
                Фотография
            </div>


            {% if dish.image_url %}

                <div class="current-photo">

                    <img
                        src="{{ dish.image_url }}"
                        alt="{{ dish.dish_name }}"
                    >

                    <div class="photo-info">
                        Текущая фотография блюда.<br>
                        Чтобы заменить её, выберите новый файл ниже.
                    </div>

                </div>

            {% else %}

                <div class="current-photo">

                    <div class="no-current-photo">
                        У блюда пока нет фотографии.
                    </div>

                </div>

            {% endif %}


            <div class="field">

                <label for="image">
                    Новая фотография
                </label>

                <input
                    type="file"
                    id="image"
                    name="image"
                    accept="image/*"
                >

            </div>

        </div>


        <!-- ACTIONS -->

        <div class="form-actions">

            <a
                href="/menu_page"
                class="btn cancel"
            >
                Отмена
            </a>

            <button
                type="submit"
                class="btn save"
            >
                Сохранить изменения
            </button>

        </div>

    </form>

</div>

</body>
</html>
