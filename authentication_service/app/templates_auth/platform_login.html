<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c0a10">
    <title>Platform Admin | FDCPlatform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0c0a10;
            --surface: #15121b;
            --surface-light: #1e1a26;
            --border: rgba(255,255,255,.08);
            --accent: #8b5cf6;
            --accent-soft: rgba(139,92,246,.12);
            --accent-border: rgba(139,92,246,.25);
            --purple-light: #c4b5fd;
            --text: #f4f0e9;
            --muted: #a9a3b3;
            --green: #9bc8a5;
            --warning: #d8c8a0;
            --warning-soft: rgba(199,165,106,.06);
            --warning-border: rgba(199,165,106,.3);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background:
                radial-gradient(circle at 50% 0%, rgba(139,92,246,.18), transparent 38%),
                var(--bg);
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .card {
            width: min(100%, 460px);
            padding: 44px 38px;
            border: 1px solid var(--accent-border);
            border-radius: 20px;
            background: linear-gradient(145deg, var(--surface-light), var(--surface));
            box-shadow: 0 30px 90px rgba(0,0,0,.45);
            text-align: center;
            animation: appear .5s ease both;
        }

        .icon {
            width: 72px;
            height: 72px;
            display: grid;
            place-items: center;
            margin: 0 auto 24px;
            border: 1px solid var(--accent-border);
            border-radius: 50%;
            background: var(--accent-soft);
            color: var(--purple-light);
            font-size: 30px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 28px;
            font-weight: normal;
            margin-bottom: 14px;
            line-height: 1.3;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field label {
            color: var(--text);
            font-size: 12px;
            font-weight: 500;
        }

        .required {
            color: var(--warning);
        }

        .field input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(0,0,0,.25);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .field input::placeholder {
            color: #6e6879;
        }

        .field input:hover {
            border-color: rgba(255,255,255,.16);
        }

        .field input:focus {
            border-color: var(--accent);
            background: rgba(0,0,0,.35);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .field-error {
            margin-top: 4px;
            color: #e08b8b;
            font-size: 12px;
            line-height: 1.5;
        }

        #form-error {
            display: none;
            padding: 12px 14px;
            border: 1px solid rgba(224,139,139,.35);
            border-radius: 10px;
            background: rgba(224,139,139,.08);
            color: #e08b8b;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            text-align: left;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
        }

        .btn-primary {
            margin-top: 6px;
            background: linear-gradient(145deg, #7c3aed, #8b5cf6);
            color: #fff;
            border: 1px solid #8b5cf6;
            font-family: inherit;
        }

        .btn-primary:hover {
            background: linear-gradient(145deg, #8b5cf6, #a78bfa);
            box-shadow: 0 10px 28px rgba(139,92,246,.35);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: .6;
            cursor: wait;
            transform: none;
            box-shadow: none;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .card { padding: 32px 24px; }
            h1 { font-size: 24px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">🔒</div>

        <h1>Вход супер-администратора</h1>

        <p class="subtitle">
            Введите данные для доступа к управлению платформой
        </p>

        <form id="adminLoginForm" class="form">
            <div class="field">
                <label for="email">Email <span class="required">*</span></label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="admin@example.com"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Пароль <span class="required">*</span></label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Введите пароль"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="field">
                <label for="authentication_key">Специальный ключ платформы <span class="required">*</span></label>
                <input
                    type="password"
                    id="authentication_key"
                    name="authentication_key"
                    placeholder="Введите специальный ключ"
                    autocomplete="off"
                    required
                >
            </div>

            <div id="form-error" class="field-error"></div>

            <button type="submit" class="btn btn-primary">
                Войти
            </button>
        </form>
    </main>

    <script src="/static/api.js"></script>

    <script>
        const i18n = {
            error_generic: "Произошла ошибка.",
            error_server: "Ошибка сервера. Попробуйте позже.",
            error_connection: "Не удалось подключиться к серверу. Проверьте соединение.",
            invalid_value: "Некорректное значение."
        };

        const form = document.getElementById("adminLoginForm");
        const formError = document.getElementById("form-error");

        function clearError(input) {
            input.style.borderColor = "";
            const error = input.parentElement.querySelector(".field-error:not(#form-error)");
            if (error) error.remove();
        }

        function showError(input, message) {
            clearError(input);
            input.style.borderColor = "#e08b8b";
            const error = document.createElement("div");
            error.className = "field-error";
            error.textContent = message;
            input.parentElement.appendChild(error);
        }

        function clearAllErrors() {
            form.querySelectorAll(".field-error:not(#form-error)").forEach(error => error.remove());
            form.querySelectorAll("input").forEach(input => input.style.borderColor = "");
            formError.textContent = "";
            formError.style.display = "none";
        }

        function showFormError(message) {
            formError.textContent = message;
            formError.style.display = "block";
        }

        async function handleFieldErrors(response) {
            let data;
            try {
                data = await response.json();
            } catch {
                showFormError(i18n.error_generic);
                return;
            }

            if (Array.isArray(data.detail)) {
                data.detail.forEach(error => {
                    const field = error.loc?.at(-1);
                    const input = form.querySelector(`[name="${field}"]`);
                    if (input) showError(input, error.msg || i18n.invalid_value);
                });
                return;
            }

            if (typeof data.detail === "string") {
                showFormError(data.detail);
                return;
            }

            if (typeof data.message === "string") {
                showFormError(data.message);
                return;
            }

            showFormError(i18n.error_generic);
        }

        async function handleResponse(response) {
            if (response.ok) return true;

            if ([422, 401, 403].includes(response.status)) {
                await handleFieldErrors(response);
                return false;
            }

            if (response.status >= 500) {
                showFormError(i18n.error_server);
                return false;
            }

            showFormError(i18n.error_generic);
            return false;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();
            clearAllErrors();

            const submitBtn = form.querySelector(".btn");
            submitBtn.disabled = true;
            submitBtn.textContent = "Вход...";

            try {
                const response = await apiFetch("/admin/login/secret_api", {
                    method: "POST",
                    body: new FormData(form)
                });

                if (!await handleResponse(response)) return;
                window.location.href = "/admin_panel/secret_api";
            } catch (error) {
                console.error(error);
                showFormError(i18n.error_connection);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Войти";
            }
        });
    </script>
</body>
</html>
