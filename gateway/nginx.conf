server {
    listen 80;

    location /login {
        proxy_pass http://authentication-service:8000;
    }

    location /registration {
        proxy_pass http://authentication-service:8000;
    }

    location /user/my_profile {
        proxy_pass http://user-service:8005;
    }

    location /logout {
        proxy_pass http://user-service:8005;
    }

    location /user/edit {
        proxy_pass http://user-service:8005;
    }

    location /bar_name {
        proxy_pass http://authentication-service:8000;
    }

    location /user/delete {
        proxy_pass http://user-service:8005;
    }

    location /user/password {
        proxy_pass http://user-service:8005;
    }

    location /edit_email {
        proxy_pass http://authentication-service:8000;
    }

    location /edit_password {
        proxy_pass http://authentication-service:8000;
    }

    location /admin/login {
        proxy_pass http://authentication-service:8000;
    }

    location /admin/registration {
        proxy_pass http://authentication-service:8000;
    }

    location  /admin_panel/edit/ {
        proxy_pass http://admin-service:8002;
    }

    location  /admin_panel/all_admins/add_admin {
        proxy_pass http://admin-service:8002;
    }

    location  /admin_panel/all_admins {
        proxy_pass http://admin-service:8002;
    }

    location  /admin_panel {
        proxy_pass http://admin-service:8002;
    }


}