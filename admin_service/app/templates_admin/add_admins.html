<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить администратора — BAR</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        color-scheme: dark;
        --gold: #d5a65b;
        --purple: #a78bfa;
        --purple-light: #c4b5fd;
        --muted: #929096;
        --muted-soft: #77777d;
        --panel: rgba(27, 25, 27, .96);
        --panel-soft: rgba(30, 29, 31, .97);
        --line: rgba(213, 166, 91, .16);
        --line-soft: rgba(255, 255, 255, .07);
        --text-main: #f5f5f5;
        --text-soft: #c7c2bc;
    }

    html {
        min-width: 320px;
    }

    body {
        min-height: 100vh;
        background:
            radial-gradient(ellipse at 50% 0%, rgba(145, 85, 75, .20) 0%, rgba(55, 35, 40, .22) 38%, rgba(9, 9, 11, 1) 78%),
            linear-gradient(180deg, #211a1c 0%, #121214 50%, #09090b 100%);
        color: #ffffff;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
    }

    button, input, select {
        font: inherit;
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
        outline: 2px solid var(--purple);
        outline-offset: 3px;
    }

    .container {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        padding: 40px 30px 60px;
    }

    .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 45px;
    }

    .back {
        color: var(--muted-soft);
        font-size: 11px;
        text-decoration: none;
        transition: color .2s;
    }

    .back:hover {
        color: var(--gold);
    }

    .brand {
        color: var(--gold);
        font-family: Georgia, serif;
        font-size: 11px;
        letter-spacing: 3px;
    }

    /* Заголовок */

    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .header span {
        color: var(--gold);
        font-size: 9px;
        letter-spacing: 3px;
        text-transform: uppercase;
    }

    .header h1 {
        margin-top: 10px;
        color: var(--text-main);
        font-family: Georgia, serif;
        font-size: clamp(28px, 3.2vw, 34px);
        font-weight: normal;
        letter-spacing: 1px;
        line-height: 1.25;
    }

    .header p {
        margin-top: 10px;
        color: var(--muted-soft);
        font-size: 12px;
        line-height: 1.5;
    }

    /* Форма */

    .form {
        padding: 24px 22px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, .14);
    }

    .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }

    .field {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 500;
        letter-spacing: .8px;
        text-transform: uppercase;
    }

    input,
    select {
        width: 100%;
        min-height: 38px;
        padding: 9px 11px;
        background: #2a282a;
        border: 1px solid rgba(255, 255, 255, .09);
        border-radius: 6px;
        color: var(--text-main);
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        font-size: 12px;
        outline: none;
        transition: background .2s, border-color .2s;
    }

    input:hover,
    select:hover {
        border-color: rgba(167, 139, 250, .35);
    }

    input:focus,
    select:focus {
        background: #302e30;
        border-color: var(--purple);
    }

    input::placeholder {
        color: var(--muted-soft);
    }

    select {
        cursor: pointer;
        color-scheme: dark;
    }

    select option {
        background: #1b191b;
        color: var(--text-main);
    }

    .field-error {
        margin-top: 5px;
        color: #d98282;
        font-size: 11px;
        line-height: 1.5;
    }

    #form-error {
        margin-top: 0;
        margin-bottom: 8px;
        padding: 11px 13px;
        background: rgba(150, 55, 65, .16);
        border: 1px solid rgba(210, 85, 90, .32);
        border-radius: 7px;
    }

    /* Кнопки */

    .buttons {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
    }

    .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 9px 16px;
        border-radius: 6px;
        font-family: Arial, sans-serif;
        font-size: 10px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: background .2s, border-color .2s, color .2s;
    }

    .cancel {
        color: #aaa9ae;
        background: rgba(42, 40, 42, .95);
        border: 1px solid rgba(255, 255, 255, .08);
    }

    .cancel:hover {
        background: rgba(52, 49, 52, .98);
        border-color: var(--gold);
        color: #ffffff;
    }

    .save {
        background: rgba(213, 166, 91, .13);
        border: 1px solid rgba(213, 166, 91, .4);
        color: var(--gold);
        font-weight: 600;
    }

    .save:hover {
        background: rgba(213, 166, 91, .22);
        border-color: var(--gold);
        color: #e4b971;
    }

    @media (max-width: 600px) {
        .container {
            padding: 30px 15px 45px;
        }

        .row {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .form {
            padding: 20px;
        }

        .buttons {
            flex-direction: column-reverse;
        }

        .button {
            width: 100%;
            text-align: center;
        }
    }
</style>

</head>

<body>
    <main class="container">
        <div class="top">
            <a href="/admin_panel/all_admins" class="back">
                ← Назад
            </a>
            <span class="brand">BAR. ADMIN</span>
        </div>

    <header class="header">
        <span>MANAGEMENT</span>
        <h1>Новый администратор</h1>
        <p>Заполните данные сотрудника</p>
    </header>

    <form class="form" id="addAdminForm">
        <div class="row">
            <div class="field">
                <label for="first-name">Имя</label>
                <input
                    type="text"
                    id="first-name"
                    name="name"
                    placeholder="Имя"
                    required>
            </div>

            <div class="field">
                <label for="last-name">Фамилия</label>
                <input
                    type="text"
                    id="last-name"
                    name="surname"
                    placeholder="Фамилия"
                    required>
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label for="birth-date">Дата рождения</label>
                <input
                    type="date"
                    id="birth-date"
                    name="birthday"
                    required>
            </div>

            <div class="field">
                <label for="phone">Номер телефона</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+49..."
                    required>
            </div>
        </div>

        <div class="field">
            <label for="email">Почта</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@mail.com"
                required>
        </div>

        <div class="field">
            <label for="password">Пароль</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Пароль"
                required>
        </div>

        <div class="field">
            <label for="role">Статус</label>
            <select id="role" name="role" required>
                <option value="" disabled selected>
                    Выберите статус
                </option>
                <option value="admin">
                    Администратор
                </option>
                <option value="moderator">
                    Модератор
                </option>
            </select>
        </div>

        <div id="form-error" class="field-error"></div>

        <div class="buttons">
            <a href="/admin_panel/all_admins" class="button cancel">
                Отмена
            </a>

            <button type="submit" class="button save">
                Создать
            </button>
        </div>
    </form>
</main>

<script src="/static/api.js"></script>

<script>
    const form = document.getElementById("addAdminForm");
    const formError = document.getElementById("form-error");

    function clearError(input) {
        input.style.borderColor = "";

        const error = input.parentElement.querySelector(
            ".field-error:not(#form-error)"
        );

        if (error) {
            error.remove();
        }
    }

    function showError(input, message) {
        clearError(input);

        input.style.borderColor = "#d98282";

        const error = document.createElement("div");
        error.className = "field-error";
        error.textContent = message;

        input.parentElement.appendChild(error);
    }

    function clearAllErrors() {
        form.querySelectorAll(
            ".field-error:not(#form-error)"
        ).forEach(error => {
            error.remove();
        });

        form.querySelectorAll("input, select").forEach(input => {
            input.style.borderColor = "";
        });

        formError.textContent = "";
    }

    async function handleErrors(response) {
        let data = null;

        try {
            data = await response.json();
        } catch {
            formError.textContent = "Не удалось обработать ответ сервера.";
            return;
        }

        if (Array.isArray(data.detail)) {
            data.detail.forEach(error => {
                const field = error.loc?.at(-1);

                if (!field) {
                    return;
                }

                const input = form.querySelector(
                    `[name="${field}"]`
                );

                if (input) {
                    showError(input, error.msg);
                } else {
                    formError.textContent = error.msg || "Произошла ошибка.";
                }
            });

            return;
        }

        if (typeof data.detail === "string") {
            formError.textContent = data.detail;
            return;
        }

        if (typeof data.message === "string") {
            formError.textContent = data.message;
            return;
        }

        formError.textContent = "Произошла ошибка.";
    }

    async function handleResponse(response) {
        if (response.ok) {
            return true;
        }

        if (
            response.status === 422 ||
            response.status === 403 ||
            response.status === 409 ||
            response.status === 400 ||
            response.status === 401
        ) {
            await handleErrors(response);
            return false;
        }

        if (response.status >= 500) {
            formError.textContent =
                "Ошибка сервера. Попробуйте позже.";
            return false;
        }

        formError.textContent =
            "Произошла ошибка.";

        return false;
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        clearAllErrors();

        try {
            const response = await apiFetch(
                "/admin_panel/all_admins/add_admin",
                {
                    method: "POST",
                    body: new FormData(form)
                }
            );

            if (!await handleResponse(response)) {
                return;
            }

            window.location.href =
                "/admin_panel/all_admins";
        } catch (error) {
            console.error(error);

            formError.textContent =
                "Не удалось подключиться к серверу. " +
                "Проверьте соединение.";
        }
    });
</script>

</body>
</html>
