<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Добавить администратора — BAR</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 0%, #29231a 0%, #111113 45%, #0c0c0e 100%);
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 40px 30px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 45px;
        }

        .back {
            color: #77777d;
            text-decoration: none;
            font-size: 12px;
        }

        .back:hover {
            color: #d5a65b;
        }

        .brand {
            color: #55555a;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header span {
            color: #d5a65b;
            font-size: 9px;
            letter-spacing: 3px;
        }

        .header h1 {
            margin-top: 8px;
            font-family: Georgia, serif;
            font-size: 34px;
            font-weight: normal;
        }

        .header p {
            margin-top: 8px;
            color: #77777d;
            font-size: 11px;
        }

        .form {
            padding: 25px;
            background: #18181b;
            border: 1px solid #29292d;
            border-radius: 12px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #aaa9ae;
            font-size: 10px;
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;

            background: #222225;
            border: 1px solid #333338;
            border-radius: 7px;

            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 11px;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #d5a65b;
        }

        select {
            cursor: pointer;
        }

        .field-error {
            margin-top: 5px;
            color: #d98282;
            font-size: 11px;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
            padding-top: 20px;
            border-top: 1px solid #29292d;
        }

        .button {
            padding: 10px 17px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 10px;
            cursor: pointer;
        }

        .cancel {
            color: #99999f;
            background: #222225;
            border: 1px solid #333338;
        }

        .cancel:hover {
            color: #fff;
        }

        .save {
            border: none;
            background: #d5a65b;
            color: #111;
            font-weight: bold;
        }

        .save:hover {
            background: #e4b971;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 15px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .form {
                padding: 20px;
            }

            .buttons {
                flex-direction: column-reverse;
            }

            .button {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="top">
            <a href="/admin_panel/all_admins" class="back">
                ← Назад
            </a>

            <span class="brand">BAR. ADMIN</span>
        </div>

        <header class="header">
            <span>MANAGEMENT</span>
            <h1>Новый администратор</h1>
            <p>Заполните данные сотрудника</p>
        </header>

        <form class="form" id="addAdminForm">

            <div class="row">

                <div class="field">
                    <label for="first-name">Имя</label>

                    <input
                        type="text"
                        id="first-name"
                        name="name"
                        placeholder="Имя"
                        required>
                </div>

                <div class="field">
                    <label for="last-name">Фамилия</label>

                    <input
                        type="text"
                        id="last-name"
                        name="surname"
                        placeholder="Фамилия"
                        required>
                </div>

            </div>

            <div class="row">

                <div class="field">
                    <label for="birth-date">Дата рождения</label>

                    <input
                        type="date"
                        id="birth-date"
                        name="birthday"
                        required>
                </div>

                <div class="field">
                    <label for="phone">Номер телефона</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="+49..."
                        required>
                </div>

            </div>

            <div class="field">
                <label for="email">Почта</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@mail.com"
                    required>
            </div>

            <div class="field">
                <label for="password">Пароль</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Пароль"
                    required>
            </div>

            <div class="field">
                <label for="role">Статус</label>

                <select id="role" name="role" required>
                    <option value="" disabled selected>
                        Выберите статус
                    </option>

                    <option value="admin">
                        Администратор
                    </option>

                    <option value="moderator">
                        Модератор
                    </option>
                </select>
            </div>

            <!-- Общее сообщение об ошибке -->
            <div id="form-error" class="field-error"></div>

            <div class="buttons">

                <a href="/admin_panel/all_admins" class="button cancel">
                    Отмена
                </a>

                <button type="submit" class="button save">
                    Создать
                </button>

            </div>

        </form>

    </main>


    <script>
        const form = document.getElementById("addAdminForm");
        const formError = document.getElementById("form-error");


        function clearError(input) {
            input.style.borderColor = "";

            const error = input.parentElement.querySelector(
                ".field-error:not(#form-error)"
            );

            if (error) {
                error.remove();
            }
        }


        function showError(input, message) {
            clearError(input);

            input.style.borderColor = "#d98282";

            const error = document.createElement("div");

            error.className = "field-error";
            error.textContent = message;

            input.parentElement.appendChild(error);
        }


        function clearAllErrors() {
            form.querySelectorAll(
                ".field-error:not(#form-error)"
            ).forEach(error => {
                error.remove();
            });

            form.querySelectorAll("input, select").forEach(input => {
                input.style.borderColor = "";
            });

            formError.textContent = "";
        }


        async function handleErrors(response) {
            const data = await response.json();

            console.log("ERROR RESPONSE:", data);

            if (Array.isArray(data.detail)) {

                data.detail.forEach(error => {

                    const field = error.loc?.at(-1);

                    const input = form.querySelector(
                        `[name="${field}"]`
                    );

                    if (input) {
                        showError(input, error.msg);
                    }

                });

                return;
            }

            if (typeof data.detail === "string") {
                formError.textContent = data.detail;
                return;
            }


            formError.textContent = "Произошла ошибка.";
        }


        async function handleResponse(response) {

            if (response.ok) {
                return true;
            }

            if (response.status === 422) {
                await handleErrors(response);
                return false;
            }

            if (response.status === 403) {
                await handleErrors(response);
                return false;
            }

            if (response.status === 409) {
                await handleErrors(response);
                return false;
            }

            if (response.status === 400) {
                await handleErrors(response);
                return false;
            }

            if (response.status === 401) {
                await handleErrors(response);
                return false;
            }

            if (response.status >= 500) {
                formError.textContent =
                    "Ошибка сервера. Попробуйте позже.";

                return false;
            }


            formError.textContent =
                "Произошла ошибка.";

            return false;
        }


        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            clearAllErrors();


            try {

                const response = await fetch(
                    "/admin_panel/all_admins/add_admin",
                    {
                        method: "POST",
                        body: new FormData(form)
                    }
                );


                if (!await handleResponse(response)) {
                    return;
                }

                window.location.href =
                    "/admin_panel/all_admins";

            } catch (error) {

                console.error(error);

                formError.textContent =
                    "Не удалось подключиться к серверу. " +
                    "Проверьте соединение.";
            }

        });
    </script>

</body>
</html>
