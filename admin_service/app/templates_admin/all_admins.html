<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Администраторы — BAR</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        color-scheme: dark;
        --gold: #d5a65b;
        --purple: #a78bfa;
        --purple-light: #c4b5fd;
        --muted: #929096;
        --muted-soft: #77777d;
        --panel: rgba(27, 25, 27, .96);
        --panel-soft: rgba(30, 29, 31, .97);
        --line: rgba(213, 166, 91, .16);
        --line-soft: rgba(255, 255, 255, .07);
        --text-main: #f5f5f5;
        --text-soft: #c7c2bc;
    }

    html {
        min-width: 320px;
        scroll-behavior: smooth;
    }

    body {
        min-height: 100vh;
        background:
            radial-gradient(ellipse at 50% 0%, rgba(145, 85, 75, .20) 0%, rgba(55, 35, 40, .22) 38%, rgba(9, 9, 11, 1) 78%),
            linear-gradient(180deg, #211a1c 0%, #121214 50%, #09090b 100%);
        color: #ffffff;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
    }

    button, input, select {
        font: inherit;
    }

    a:focus-visible,
    button:focus-visible {
        outline: 2px solid var(--purple);
        outline-offset: 3px;
    }

    .container {
        width: 100%;
        max-width: 950px;
        margin: 0 auto;
        padding: 40px 30px 60px;
    }

    .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 45px;
    }

    .back {
        color: var(--muted-soft);
        font-size: 11px;
        text-decoration: none;
        transition: color .2s;
    }

    .back:hover {
        color: var(--gold);
    }

    .brand {
        color: var(--gold);
        font-family: Georgia, serif;
        font-size: 11px;
        letter-spacing: 3px;
    }

    .header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 25px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
    }

    .header span {
        color: var(--gold);
        font-size: 9px;
        letter-spacing: 3px;
        text-transform: uppercase;
    }

    .header h1 {
        margin-top: 7px;
        color: var(--text-main);
        font-family: Georgia, serif;
        font-size: clamp(30px, 3.4vw, 36px);
        font-weight: normal;
        letter-spacing: 1px;
        line-height: 1.25;
    }

    .add {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 10px 16px;
        background: rgba(213, 166, 91, .13);
        border: 1px solid rgba(213, 166, 91, .4);
        border-radius: 7px;
        color: var(--gold);
        font-size: 10px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
        transition: background .2s, border-color .2s, color .2s;
    }

    .add:hover {
        background: rgba(213, 166, 91, .22);
        border-color: var(--gold);
        color: #e4b971;
    }

    .admins {
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    }

    .admin {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 88px;
        padding: 18px 22px;
        background: var(--panel-soft);
        border-bottom: 1px solid var(--line-soft);
        transition: background .2s;
    }

    .admin:hover {
        background: rgba(38, 36, 38, .98);
    }

    .admin:last-child {
        border-bottom: none;
    }

    .admin-info {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
    }

    .avatar {
        width: 46px;
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background: #252427;
        border: 1px solid rgba(255, 255, 255, .08);
        border-radius: 10px;
        color: var(--gold);
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        transition: .2s;
    }

    .admin:hover .avatar {
        background: var(--gold);
        color: #252427;
    }

    .admin-name {
        color: var(--text-main);
        font-size: 13px;
        font-weight: 600;
        overflow-wrap: anywhere;
    }

    .admin-role {
        margin-top: 5px;
        color: var(--muted-soft);
        font-size: 10px;
    }

    .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
    }

    .action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 31px;
        padding: 8px 11px;
        background: rgba(42, 40, 42, .95);
        border: 1px solid rgba(255, 255, 255, .08);
        border-radius: 6px;
        color: #aaa9ae;
        font-family: Arial, sans-serif;
        font-size: 9px;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
        transition: background .2s, border-color .2s, color .2s;
    }

    .action:hover {
        background: rgba(52, 49, 52, .98);
        border-color: var(--gold);
        color: #ffffff;
    }

    .delete:hover {
        border-color: rgba(210, 85, 90, .5);
        color: #d98282;
    }

    .field-error {
        padding: 15px 20px;
        color: #d98282;
        font-size: 11px;
        text-align: center;
    }

    @media (max-width: 600px) {
        .container {
            padding: 30px 15px 45px;
        }

        .top {
            margin-bottom: 35px;
        }

        .header {
            align-items: stretch;
            flex-direction: column;
            gap: 15px;
        }

        .add {
            width: 100%;
            text-align: center;
        }

        .admin {
            align-items: flex-start;
            flex-direction: column;
        }

        .actions {
            width: 100%;
        }

        .action {
            flex: 1;
            text-align: center;
        }
    }
</style>

</head>

<body>
    <main class="container">

    <div class="top">
        <a href="/admin_panel" class="back">← Назад</a>
        <span class="brand">BAR. ADMIN</span>
    </div>

    <header class="header">
        <div>
            <span>MANAGEMENT</span>
            <h1>Администраторы</h1>
        </div>

        <a
            href="/admin_panel/all_admins/add_admin"
            class="add"
        >
            + Добавить администратора
        </a>
    </header>

    <section class="admins">
        {% for admin in admins %}
        <div class="admin">
            <div class="admin-info">
                <div class="avatar">
                    {{ admin.name[0] }}
                </div>

                <div>
                    <div class="admin-name">
                        {{ admin.name }} {{ admin.surname }}
                    </div>

                    <div class="admin-role">
                        {{ admin.role.value }}
                    </div>
                </div>
            </div>

            <div class="actions">
                <a
                    href="/admin_panel/edit/{{ admin.id }}"
                    class="action"
                >
                    Изменить
                </a>

                <form
                    class="deleteAdminForm"
                    data-admin-id="{{ admin.id }}"
                >
                    <button
                        type="submit"
                        class="action delete"
                    >
                        Удалить
                    </button>
                </form>
            </div>
        </div>
        {% endfor %}

        <div id="form-error" class="field-error"></div>
    </section>

</main>

<script src="/static/api.js"></script>

<script>
    const formError = document.getElementById("form-error");

    document.querySelectorAll(".deleteAdminForm").forEach(form => {
        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const adminId = form.dataset.adminId;

            const confirmed = confirm(
                "Вы действительно хотите удалить этого администратора?"
            );

            if (!confirmed) {
                return;
            }

            formError.textContent = "";

            try {
                const response = await apiFetch(
                    `/admin_panel/delete_admin/${adminId}`,
                    {
                        method: "POST"
                    }
                );

                if (response.ok) {
                    window.location.reload();
                    return;
                }

                let data = null;

                try {
                    data = await response.json();
                } catch {
                    data = null;
                }

                formError.textContent =
                    data?.detail ||
                    data?.message ||
                    "Не удалось удалить администратора.";
            } catch (error) {
                console.error(error);

                formError.textContent =
                    "Не удалось подключиться к серверу. " +
                    "Проверьте соединение.";
            }
        });
    });
</script>

</body>
</html>
