<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Администраторы — BAR</title>

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;

        background:
            radial-gradient(
                ellipse at 50% 0%,
                rgba(150, 105, 55, 0.22) 0%,
                rgba(75, 52, 38, 0.28) 40%,
                rgba(18, 18, 21, 0.98) 80%
            ),
            linear-gradient(
                180deg,
                #302621 0%,
                #1d1817 50%,
                #0d0d0f 100%
            );

        color: #eee0d5;
        font-family: Arial, sans-serif;
    }

    .container {
        max-width: 950px;
        margin: auto;
        padding: 40px 30px;
    }

    .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 50px;
    }

    .back {
        color: #927d73;
        text-decoration: none;
        font-size: 12px;

        transition: color 0.2s;
    }

    .back:hover {
        color: #d0a66a;
    }

    .brand {
        color: #685951;
        font-size: 10px;
        letter-spacing: 2px;
    }

    .header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin-bottom: 25px;
    }

    .header span {
        color: #c3985f;
        font-size: 9px;
        letter-spacing: 3px;
    }

    .header h1 {
        margin-top: 7px;

        color: #eee0d5;

        font-family: Georgia, serif;
        font-size: 36px;
        font-weight: normal;
    }

    .add {
        padding: 10px 16px;

        background: #b98d55;
        color: #201917;

        border-radius: 7px;

        text-decoration: none;
        font-size: 11px;
        font-weight: bold;

        transition: background 0.2s;
    }

    .add:hover {
        background: #cda36b;
    }

    .admins {
        overflow: hidden;

        background: rgba(27, 22, 21, 0.92);

        border: 1px solid rgba(150, 105, 65, 0.28);
        border-radius: 12px;

        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
    }

    .admin {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;

        padding: 18px 20px;

        border-bottom: 1px solid rgba(150, 105, 65, 0.20);
    }

    .admin:last-child {
        border-bottom: none;
    }

    .admin-info {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .avatar {
        width: 42px;
        height: 42px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(65, 47, 36, 0.80);

        border: 1px solid rgba(160, 115, 65, 0.25);
        border-radius: 50%;

        color: #c3985f;
        font-size: 14px;
    }

    .admin-name {
        color: #e8d7cc;
        font-size: 13px;
        font-weight: 600;
    }

    .admin-role {
        margin-top: 4px;

        color: #8e7970;

        font-size: 10px;
    }

    .actions {
        display: flex;
        gap: 7px;
    }

    .action {
        padding: 7px 11px;

        border: 1px solid rgba(150, 105, 75, 0.32);
        border-radius: 6px;

        color: #a9958b;
        background: rgba(38, 29, 27, 0.85);

        text-decoration: none;
        font-size: 10px;
        cursor: pointer;

        transition:
            border-color 0.2s,
            color 0.2s,
            background 0.2s;
    }

    .action:hover {
        border-color: rgba(190, 145, 85, 0.55);
        color: #d0a66a;
        background: rgba(48, 35, 30, 0.90);
    }

    .delete:hover {
        border-color: rgba(155, 80, 80, 0.50);
        color: #c98282;
    }

    .field-error {
        padding: 15px 20px;

        color: #c98282;

        font-size: 11px;
        text-align: center;
    }

    @media (max-width: 600px) {

        .container {
            padding: 25px 15px;
        }

        .header {
            align-items: stretch;
            flex-direction: column;
            gap: 18px;
        }

        .add {
            text-align: center;
        }

        .admin {
            align-items: flex-start;
            flex-direction: column;
        }

        .actions {
            width: 100%;
        }

        .action {
            flex: 1;
            text-align: center;
        }
    }
</style>
</head>

<body>

    <main class="container">

        <div class="top">
            <a href="/admin_panel" class="back">← Назад</a>

            <span class="brand">BAR. ADMIN</span>
        </div>


        <header class="header">

            <div>
                <span>MANAGEMENT</span>

                <h1>Администраторы</h1>
            </div>

            <a
                href="/admin_panel/all_admins/add_admin"
                class="add"
            >
                + Добавить администратора
            </a>

        </header>


        <section class="admins">

            {% for admin in admins %}

            <div class="admin">

                <div class="admin-info">

                    <div class="avatar">
                        {{ admin.name[0] }}
                    </div>

                    <div>

                        <div class="admin-name">
                            {{ admin.name }} {{ admin.surname }}
                        </div>

                        <div class="admin-role">
                            {{ admin.role.value }}
                        </div>

                    </div>

                </div>


                <div class="actions">

                    <a
                        href="/admin_panel/edit/{{ admin.id }}"
                        class="action"
                    >
                        Изменить
                    </a>


                    <form
                        class="deleteAdminForm"
                        data-admin-id="{{ admin.id }}"
                    >

                        <button
                            type="submit"
                            class="action delete"
                        >
                            Удалить
                        </button>

                    </form>

                </div>

            </div>

            {% endfor %}


            <!-- Общее сообщение об ошибке -->
            <div id="form-error" class="field-error"></div>

        </section>

    </main>


    <script>

        const formError = document.getElementById("form-error");


        document.querySelectorAll(".deleteAdminForm").forEach(form => {

            form.addEventListener("submit", async function(event) {

                event.preventDefault();


                const adminId = form.dataset.adminId;


                const confirmed = confirm(
                    "Вы действительно хотите удалить этого администратора?"
                );


                if (!confirmed) {
                    return;
                }


                formError.textContent = "";


                try {

                    const response = await fetch(
                        `/admin_panel/delete_admin/${adminId}`,
                        {
                            method: "POST"
                        }
                    );


                    if (response.ok) {

                        window.location.reload();

                        return;
                    }


                    let data = null;


                    try {

                        data = await response.json();

                    } catch {

                        data = null;
                    }


                    if (
                        data &&
                        typeof data.detail === "string"
                    ) {

                        formError.textContent = data.detail;

                    } else {

                        formError.textContent =
                            "Не удалось удалить администратора.";

                    }


                } catch (error) {

                    console.error(error);

                    formError.textContent =
                        "Не удалось подключиться к серверу. " +
                        "Проверьте соединение.";
                }

            });

        });

    </script>

</body>
</html>
