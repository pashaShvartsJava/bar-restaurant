<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изменение пароля | Bar & Lounge</title>
    <style>
    :root {
        --bg: #100e11;
        --bg-soft: #191418;
        --panel: rgba(25, 21, 25, 0.94);
        --panel-light: rgba(39, 29, 32, 0.92);
        --text: #eee5df;
        --muted: #93898d;
        --muted-dark: #6f666c;
        --gold: #d5a65b;
        --gold-light: #e8c58e;
        --border: rgba(255, 255, 255, 0.08);
        --gold-border: rgba(213, 166, 91, 0.38);
        --danger: #e58c8c;
        --danger-border: rgba(229, 140, 140, 0.4);
        --success: #9bc8a5;
        --success-border: rgba(155, 200, 165, 0.4);
    }

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: var(--text);
        line-height: 1.6;
        background:
            radial-gradient(
                ellipse at 50% -8%,
                rgba(157, 69, 76, 0.32) 0%,
                rgba(89, 39, 49, 0.26) 28%,
                rgba(35, 24, 30, 0.72) 54%,
                rgba(15, 14, 17, 0.98) 82%
            ),
            linear-gradient(
                180deg,
                #301b22 0%,
                #1d171c 34%,
                #121114 70%,
                #0c0c0e 100%
            );
        background-attachment: fixed;
        padding: 40px 20px;
        position: relative;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
            radial-gradient(
                circle at 12% 20%,
                rgba(183, 91, 78, 0.055),
                transparent 30%
            ),
            radial-gradient(
                circle at 88% 34%,
                rgba(213, 166, 91, 0.035),
                transparent 28%
            );
    }

    a {
        color: inherit;
        -webkit-tap-highlight-color: transparent;
    }

    button,
    input,
    select,
    textarea {
        font: inherit;
    }

    .page {
        position: relative;
        z-index: 1;
        width: 700px;
        max-width: 100%;
        margin: auto;
    }

    /* ===== Верхняя панель ===== */

    .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
    }

    .back {
        color: #a79b9d;
        text-decoration: none;
        font-size: 12px;
        transition: color 0.2s;
    }

    .back:hover {
        color: var(--gold-light);
    }

    .brand {
        color: var(--gold);
        font-family: Georgia, serif;
        letter-spacing: 3px;
        font-size: 11px;
    }

    /* ===== Основная карточка ===== */

    .card {
        background: linear-gradient(
            145deg,
            rgba(41, 29, 33, 0.98),
            rgba(16, 15, 18, 0.99)
        );
        border: 1px solid var(--gold-border);
        border-radius: 18px;
        padding: 35px;
        box-shadow:
            0 35px 90px rgba(0, 0, 0, 0.42),
            0 0 45px rgba(213, 166, 91, 0.06),
            inset 0 1px rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(16px);
        animation: appear 0.55s ease both;
    }

    .header {
        margin-bottom: 25px;
    }

    .header-label {
        color: var(--gold);
        font-size: 9px;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 8px;
    }

    h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 30px;
        font-weight: normal;
        letter-spacing: -0.5px;
        line-height: 1.25;
        color: #f0e5de;
    }

    .description {
        color: var(--muted);
        font-size: 12px;
        margin-top: 9px;
        line-height: 1.7;
    }

    /* ===== Блок пользователя ===== */

    .user-info {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 18px;
        margin-bottom: 25px;
        background: linear-gradient(
            145deg,
            rgba(32, 26, 29, 0.91),
            rgba(17, 16, 19, 0.96)
        );
        border: 1px solid rgba(255, 255, 255, 0.075);
        border-radius: 14px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(12px);
    }

    .avatar {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        border-radius: 50%;
        background: rgba(213, 166, 91, 0.1);
        border: 1px solid rgba(213, 166, 91, 0.3);
        color: var(--gold-light);
        font-family: Georgia, serif;
        font-size: 17px;
        font-weight: normal;
    }

    .user-name {
        color: #e5dad6;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 4px;
    }

    /* ===== Секция формы ===== */

    .section {
        background: linear-gradient(
            145deg,
            rgba(32, 26, 29, 0.91),
            rgba(17, 16, 19, 0.96)
        );
        border: 1px solid rgba(255, 255, 255, 0.075);
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(12px);
    }

    .section-title {
        color: var(--gold);
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 20px;
    }

    .field {
        margin-bottom: 16px;
    }

    .field:last-child {
        margin-bottom: 0;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #c8bfc0;
        font-size: 10px;
        line-height: 1.5;
    }

    input,
    select,
    textarea {
        width: 100%;
        min-height: 44px;
        padding: 12px 13px;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 9px;
        color: #eee8e3;
        font-size: 12px;
        outline: none;
        transition:
            border-color 0.25s,
            background 0.25s,
            box-shadow 0.25s;
    }

    input::placeholder,
    textarea::placeholder {
        color: #6e666b;
    }

    input:hover,
    select:hover,
    textarea:hover {
        border-color: rgba(255, 255, 255, 0.2);
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: rgba(213, 166, 91, 0.75);
        background: rgba(255, 255, 255, 0.07);
        box-shadow: 0 0 0 3px rgba(213, 166, 91, 0.1);
    }

    textarea {
        min-height: 100px;
        resize: vertical;
        line-height: 1.6;
    }

    /* ===== Сообщения ===== */

    .error {
        display: none;
        margin-top: 15px;
        padding: 12px 13px;
        background: rgba(240, 168, 168, 0.05);
        border: 1px solid rgba(240, 168, 168, 0.35);
        border-radius: 8px;
        color: #f2b6b6;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.5;
        text-align: center;
        overflow-wrap: anywhere;
    }

    .error.visible {
        display: block;
    }

    .success {
        display: none;
        margin-top: 15px;
        padding: 12px 13px;
        background: rgba(155, 200, 165, 0.06);
        border: 1px solid var(--success-border);
        border-radius: 8px;
        color: var(--success);
        font-size: 11px;
        font-weight: 500;
        line-height: 1.5;
        text-align: center;
        overflow-wrap: anywhere;
    }

    .success.visible {
        display: block;
    }

    /* ===== Нижняя панель ===== */

    .bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-top: 28px;
        padding-top: 22px;
        border-top: 1px solid rgba(255, 255, 255, 0.075);
    }

    .cancel {
        color: #a79b9d;
        text-decoration: none;
        font-size: 12px;
        transition: color 0.2s;
    }

    .cancel:hover {
        color: var(--text);
    }

    .save {
        min-height: 44px;
        padding: 12px 25px;
        border: 1px solid rgba(213, 166, 91, 0.45);
        border-radius: 9px;
        background: linear-gradient(
            135deg,
            rgba(111, 67, 49, 0.5),
            rgba(66, 38, 42, 0.8)
        );
        color: var(--gold-light);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.4px;
        cursor: pointer;
        transition:
            transform 0.22s,
            background 0.22s,
            border-color 0.22s,
            box-shadow 0.22s;
    }

    .save:hover {
        transform: translateY(-2px);
        border-color: var(--gold);
        background: linear-gradient(
            135deg,
            rgba(142, 88, 55, 0.56),
            rgba(83, 45, 46, 0.9)
        );
        box-shadow: 0 9px 25px rgba(213, 166, 91, 0.12);
    }

    .save:active {
        transform: translateY(0);
    }

    .save:disabled {
        opacity: 0.65;
        cursor: wait;
        transform: none;
    }

    /* ===== Анимация ===== */

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(14px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        html {
            scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
            transition-duration: 0.01ms !important;
            animation-duration: 0.01ms !important;
        }
    }

    /* ===== Адаптивность ===== */

    @media (max-width: 600px) {
        body {
            padding: 25px 15px;
        }

        .card {
            padding: 25px 18px;
            border-radius: 14px;
        }

        .bottom {
            flex-direction: column;
            gap: 15px;
            align-items: stretch;
        }

        .save {
            width: 100%;
        }

        h1 {
            font-size: 26px;
        }

        .user-info {
            padding: 16px;
        }
    }
</style>
</head>
<body>
<div class="page">
    <div class="top">
        <a href="/user/edit" class="back">← Вернуться к настройкам</a>
        <div class="brand">BAR & LOUNGE</div>
    </div>
    <div class="card">
        <div class="header">
            <div class="header-label">SECURITY</div>
            <h1>Изменение пароля</h1>
            <div class="description">Обновление пароля учётной записи</div>
        </div>
        <div class="user-info">
            <div class="avatar">{{ user.name[0] }}{{ user.surname[0] }}</div>
            <div>
                <div class="user-name">Изменение пароля пользователя {{ user.name }} {{ user.surname }}</div>
            </div>
        </div>
        <form id="passwordForm">
            <div class="section">
                <div class="section-title">НОВЫЙ ПАРОЛЬ</div>
                <div class="field">
                    <label>Старый пароль</label>
                    <input type="password" name="old_password" required>
                </div>
                <div class="field">
                    <label>Новый пароль</label>
                    <input type="password" name="new_password" required>
                </div>
                <div class="field">
                    <label>Подтвердите новый пароль</label>
                    <input type="password" name="confirmed_password" required>
                </div>
                <div id="passwordError" class="error"></div>
                <div id="passwordSuccess" class="success"></div>
            </div>
            <div class="bottom">
                <a href="/user/edit" class="cancel">Отмена</a>
                <button type="submit" class="save" id="saveButton">Подтвердить</button>
            </div>
        </form>
    </div>
</div>
<script src="/static/api.js"></script>
<script>
    const form = document.getElementById("passwordForm");
    const button = document.getElementById("saveButton");
    const errorBlock = document.getElementById("passwordError");
    const successBlock = document.getElementById("passwordSuccess");

function showError(message) {
    errorBlock.textContent = message;
    errorBlock.style.display = "block";
    successBlock.style.display = "none";
    successBlock.textContent = "";
}

function showSuccess(message) {
    successBlock.textContent = message;
    successBlock.style.display = "block";
    errorBlock.style.display = "none";
    errorBlock.textContent = "";
}

function clearMessages() {
    errorBlock.style.display = "none";
    errorBlock.textContent = "";
    successBlock.style.display = "none";
    successBlock.textContent = "";
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();
    clearMessages();

    const oldPassword = form.querySelector('input[name="old_password"]').value;
    const newPassword = form.querySelector('input[name="new_password"]').value;
    const confirmedPassword = form.querySelector('input[name="confirmed_password"]').value;

    if (!oldPassword || !newPassword || !confirmedPassword) {
        showError("Заполните все поля.");
        return;
    }

    if (newPassword !== confirmedPassword) {
        showError("Новые пароли не совпадают.");
        return;
    }

    button.disabled = true;
    button.textContent = "Отправка...";

    try {
        const response = await apiFetch("/user/password", {
            method: "PATCH",
            body: new FormData(form)
        });

        if (response.ok) {
            showSuccess("Запрос на смену пароля создан. Проверьте вашу почту и перейдите по ссылке для подтверждения смены пароля. До подтверждения ссылки ваш текущий пароль останется без изменений.");
            form.querySelector('input[name="old_password"]').value = "";
            form.querySelector('input[name="new_password"]').value = "";
            form.querySelector('input[name="confirmed_password"]').value = "";
            return;
        }

        let message = "Произошла ошибка при изменении пароля.";

        try {
            const data = await response.json();

            if (Array.isArray(data.detail)) {
                message = data.detail.map(error => error.msg || "Некорректное значение.").join(", ");
            } else if (data.detail) {
                message = typeof data.detail === "string" ? data.detail : "Произошла ошибка при изменении пароля.";
            } else if (data.message) {
                message = data.message;
            }
        } catch {}

        if (response.status === 401) {
            window.location.href = "/login";
            return;
        }

        if (response.status === 403) {
            message = "У вас нет доступа к этому действию.";
        } else if (response.status === 404) {
            message = "Данные не найдены.";
        } else if (response.status >= 500) {
            message = "Ошибка сервера. Попробуйте позже.";
        }

        showError(message);
    } catch {
        showError("Не удалось связаться с сервером. Попробуйте ещё раз.");
    } finally {
        button.disabled = false;
        button.textContent = "Подтвердить";
    }
});

</script>
</body>
</html>
