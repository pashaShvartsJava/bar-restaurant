<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изменение пароля | Bar & Lounge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(213,166,91,.2), transparent 30%),
                radial-gradient(circle at 85% 85%, rgba(180,70,110,.16), transparent 30%),
                linear-gradient(135deg, #24191f, #39252c, #21191e);
            color: #fff;
            padding: 40px 20px;
        }

        .page {
            width: 700px;
            max-width: 100%;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .back {
            color: #aaa;
            text-decoration: none;
            font-size: 12px;
            transition: .2s;
        }

        .back:hover {
            color: #d5a65b;
        }

        .brand {
            color: #d5a65b;
            font-family: Georgia, serif;
            letter-spacing: 3px;
            font-size: 11px;
        }

        .card {
            background: rgba(39,32,38,.96);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,.4);
        }

        .header {
            margin-bottom: 25px;
        }

        .header-label {
            color: #d5a65b;
            font-size: 9px;
            letter-spacing: 3px;
            margin-bottom: 7px;
        }

        h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 30px;
            font-weight: normal;
        }

        .description {
            color: #999;
            font-size: 12px;
            margin-top: 8px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            margin-bottom: 25px;
            background: rgba(255,255,255,.025);
            border: 1px solid #40383e;
            border-radius: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 50%;
            background: #302a30;
            color: #d5a65b;
            font-size: 16px;
            font-weight: 600;
        }

        .user-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .section {
            background: rgba(255,255,255,.025);
            border: 1px solid #40383e;
            border-radius: 14px;
            padding: 22px;
        }

        .section-title {
            color: #d5a65b;
            font-size: 10px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #ccc;
            font-size: 11px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #302a30;
            border: 1px solid #51484e;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
            transition: .2s;
        }

        input:focus {
            border-color: #d5a65b;
            box-shadow: 0 0 0 3px rgba(213,166,91,.07);
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: rgba(255, 70, 70, 0.08);
            border: 1px solid rgba(255, 70, 70, 0.25);
            border-radius: 8px;
            color: #ff6b6b;
            font-size: 12px;
            text-align: center;
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #40383e;
        }

        .cancel {
            color: #999;
            text-decoration: none;
            font-size: 12px;
        }

        .cancel:hover {
            color: white;
        }

        .save {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #d5a65b;
            color: #211a15;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        .save:hover {
            background: #e5b970;
            transform: translateY(-1px);
        }

        .save:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 15px;
            }

            .card {
                padding: 25px 18px;
            }

            .bottom {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .save {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="top">
        <a href="/user/edit" class="back">
            ← Вернуться к настройкам
        </a>

        <div class="brand">
            BAR & LOUNGE
        </div>
    </div>

    <div class="card">

        <div class="header">
            <div class="header-label">
                SECURITY
            </div>

            <h1>
                Изменение пароля
            </h1>

            <div class="description">
                Обновление пароля учётной записи
            </div>
        </div>

        <div class="user-info">

            <div class="avatar">
                {{ user.name[0] }}{{ user.surname[0] }}
            </div>

            <div>
                <div class="user-name">
                    Изменение пароля пользователя {{ user.name }} {{ user.surname }}
                </div>
            </div>

        </div>

        <form id="passwordForm">

            <div class="section">

                <div class="section-title">
                    НОВЫЙ ПАРОЛЬ
                </div>

                <div class="field">
                    <label>
                        Старый пароль
                    </label>

                    <input
                        type="password"
                        name="old_password"
                        required
                    >
                </div>

                <div class="field">
                    <label>
                        Новый пароль
                    </label>

                    <input
                        type="password"
                        name="new_password"
                        required
                    >
                </div>

                <div class="field">
                    <label>
                        Подтвердите новый пароль
                    </label>

                    <input
                        type="password"
                        name="confirmed_password"
                        required
                    >
                </div>

                <div id="passwordError" class="error"></div>

            </div>

            <div class="bottom">

                <a href="/user/edit" class="cancel">
                    Отмена
                </a>

                <button
                    type="submit"
                    class="save"
                    id="saveButton"
                >
                    Подтвердить
                </button>

            </div>

        </form>

    </div>

</div>

<script>

document.getElementById("passwordForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const form = this;
    const button = document.getElementById("saveButton");
    const errorBlock = document.getElementById("passwordError");

    const oldPassword = form.querySelector('input[name="old_password"]').value;
    const newPassword = form.querySelector('input[name="new_password"]').value;
    const confirmedPassword = form.querySelector('input[name="confirmed_password"]').value;

    // Скрываем предыдущую ошибку
    errorBlock.style.display = "none";
    errorBlock.textContent = "";

    // Проверка на фронте
    if (!oldPassword || !newPassword || !confirmedPassword) {
        showError("Заполните все поля.");
        return;
    }

    // Проверка совпадения новых паролей
    if (newPassword !== confirmedPassword) {
        showError("Новые пароли не совпадают.");
        return;
    }

    button.disabled = true;
    button.textContent = "Сохранение...";

    try {

        const response = await fetch("/user/password", {
            method: "PATCH",
            body: new FormData(form)
        });

        // Пароль успешно изменён
        if (response.ok) {

            // Вызываем logout
            const logoutResponse = await fetch("/logout", {
                method: "POST"
            });

            // Переходим на страницу логина
            if (
                logoutResponse.ok ||
                logoutResponse.status === 303 ||
                logoutResponse.redirected
            ) {
                window.location.href = "/login";
                return;
            }

            // Даже если logout не вернул ожидаемый статус,
            // всё равно отправляем пользователя на login
            window.location.href = "/login";
            return;
        }

        // Получаем сообщение об ошибке от backend
        let message = "Произошла ошибка при изменении пароля.";

        try {
            const data = await response.json();

            if (data.detail) {
                message = data.detail;
            }

        } catch (error) {
            console.error("Не удалось прочитать ошибку:", error);
        }

        showError(message);

    } catch (error) {

        console.error("Ошибка запроса:", error);

        showError("Не удалось связаться с сервером. Попробуйте ещё раз.");

    } finally {

        button.disabled = false;
        button.textContent = "Подтвердить";

    }

});


function showError(message) {

    const errorBlock = document.getElementById("passwordError");

    errorBlock.textContent = message;
    errorBlock.style.display = "block";

}

</script>

</body>
</html>
