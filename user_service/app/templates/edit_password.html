<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изменение пароля | Bar & Lounge</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(213,166,91,.2), transparent 30%),
                radial-gradient(circle at 85% 85%, rgba(180,70,110,.16), transparent 30%),
                linear-gradient(135deg, #24191f, #39252c, #21191e);
            color: #fff;
            padding: 40px 20px;
        }
        .page { width: 700px; max-width: 100%; margin: auto; }
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .back {
            color: #aaa;
            text-decoration: none;
            font-size: 12px;
            transition: .2s;
        }
        .back:hover { color: #d5a65b; }
        .brand {
            color: #d5a65b;
            font-family: Georgia, serif;
            letter-spacing: 3px;
            font-size: 11px;
        }
        .card {
            background: rgba(39,32,38,.96);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,.4);
        }
        .header { margin-bottom: 25px; }
        .header-label {
            color: #d5a65b;
            font-size: 9px;
            letter-spacing: 3px;
            margin-bottom: 7px;
        }
        h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 30px;
            font-weight: normal;
        }
        .description { color: #999; font-size: 12px; margin-top: 8px; }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            margin-bottom: 25px;
            background: rgba(255,255,255,.025);
            border: 1px solid #40383e;
            border-radius: 12px;
        }
        .avatar {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 50%;
            background: #302a30;
            color: #d5a65b;
            font-size: 16px;
            font-weight: 600;
        }
        .user-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .section {
            background: rgba(255,255,255,.025);
            border: 1px solid #40383e;
            border-radius: 14px;
            padding: 22px;
        }
        .section-title {
            color: #d5a65b;
            font-size: 10px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .field { margin-bottom: 16px; }
        .field:last-child { margin-bottom: 0; }
        label {
            display: block;
            margin-bottom: 6px;
            color: #ccc;
            font-size: 11px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #302a30;
            border: 1px solid #51484e;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
            transition: .2s;
        }
        input:focus {
            border-color: #d5a65b;
            box-shadow: 0 0 0 3px rgba(213,166,91,.07);
        }
        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: rgba(255,70,70,.08);
            border: 1px solid rgba(255,70,70,.25);
            border-radius: 8px;
            color: #ff6b6b;
            font-size: 12px;
            text-align: center;
        }
        .success {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: rgba(70,200,120,.08);
            border: 1px solid rgba(70,200,120,.25);
            border-radius: 8px;
            color: #63d391;
            font-size: 12px;
            text-align: center;
        }
        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #40383e;
        }
        .cancel { color: #999; text-decoration: none; font-size: 12px; }
        .cancel:hover { color: white; }
        .save {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #d5a65b;
            color: #211a15;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }
        .save:hover {
            background: #e5b970;
            transform: translateY(-1px);
        }
        .save:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }
        @media (max-width: 600px) {
            body { padding: 25px 15px; }
            .card { padding: 25px 18px; }
            .bottom {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
            .save { width: 100%; }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="top">
        <a href="/user/edit" class="back">← Вернуться к настройкам</a>
        <div class="brand">BAR & LOUNGE</div>
    </div>
    <div class="card">
        <div class="header">
            <div class="header-label">SECURITY</div>
            <h1>Изменение пароля</h1>
            <div class="description">Обновление пароля учётной записи</div>
        </div>
        <div class="user-info">
            <div class="avatar">{{ user.name[0] }}{{ user.surname[0] }}</div>
            <div>
                <div class="user-name">Изменение пароля пользователя {{ user.name }} {{ user.surname }}</div>
            </div>
        </div>
        <form id="passwordForm">
            <div class="section">
                <div class="section-title">НОВЫЙ ПАРОЛЬ</div>
                <div class="field">
                    <label>Старый пароль</label>
                    <input type="password" name="old_password" required>
                </div>
                <div class="field">
                    <label>Новый пароль</label>
                    <input type="password" name="new_password" required>
                </div>
                <div class="field">
                    <label>Подтвердите новый пароль</label>
                    <input type="password" name="confirmed_password" required>
                </div>
                <div id="passwordError" class="error"></div>
                <div id="passwordSuccess" class="success"></div>
            </div>
            <div class="bottom">
                <a href="/user/edit" class="cancel">Отмена</a>
                <button type="submit" class="save" id="saveButton">Подтвердить</button>
            </div>
        </form>
    </div>
</div>
<script src="/static/api.js"></script>
<script>
    const form = document.getElementById("passwordForm");
    const button = document.getElementById("saveButton");
    const errorBlock = document.getElementById("passwordError");
    const successBlock = document.getElementById("passwordSuccess");

function showError(message) {
    errorBlock.textContent = message;
    errorBlock.style.display = "block";
    successBlock.style.display = "none";
    successBlock.textContent = "";
}

function showSuccess(message) {
    successBlock.textContent = message;
    successBlock.style.display = "block";
    errorBlock.style.display = "none";
    errorBlock.textContent = "";
}

function clearMessages() {
    errorBlock.style.display = "none";
    errorBlock.textContent = "";
    successBlock.style.display = "none";
    successBlock.textContent = "";
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();
    clearMessages();

    const oldPassword = form.querySelector('input[name="old_password"]').value;
    const newPassword = form.querySelector('input[name="new_password"]').value;
    const confirmedPassword = form.querySelector('input[name="confirmed_password"]').value;

    if (!oldPassword || !newPassword || !confirmedPassword) {
        showError("Заполните все поля.");
        return;
    }

    if (newPassword !== confirmedPassword) {
        showError("Новые пароли не совпадают.");
        return;
    }

    button.disabled = true;
    button.textContent = "Отправка...";

    try {
        const response = await apiFetch("/user/password", {
            method: "PATCH",
            body: new FormData(form)
        });

        if (response.ok) {
            showSuccess("Запрос на смену пароля создан. Проверьте вашу почту и перейдите по ссылке для подтверждения смены пароля. До подтверждения ссылки ваш текущий пароль останется без изменений.");
            form.querySelector('input[name="old_password"]').value = "";
            form.querySelector('input[name="new_password"]').value = "";
            form.querySelector('input[name="confirmed_password"]').value = "";
            return;
        }

        let message = "Произошла ошибка при изменении пароля.";

        try {
            const data = await response.json();

            if (Array.isArray(data.detail)) {
                message = data.detail.map(error => error.msg || "Некорректное значение.").join(", ");
            } else if (data.detail) {
                message = typeof data.detail === "string" ? data.detail : "Произошла ошибка при изменении пароля.";
            } else if (data.message) {
                message = data.message;
            }
        } catch {}

        if (response.status === 401) {
            window.location.href = "/login";
            return;
        }

        if (response.status === 403) {
            message = "У вас нет доступа к этому действию.";
        } else if (response.status === 404) {
            message = "Данные не найдены.";
        } else if (response.status >= 500) {
            message = "Ошибка сервера. Попробуйте позже.";
        }

        showError(message);
    } catch {
        showError("Не удалось связаться с сервером. Попробуйте ещё раз.");
    } finally {
        button.disabled = false;
        button.textContent = "Подтвердить";
    }
});

</script>
</body>
</html>
