<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки профиля | Bar & Lounge</title>
    <style>
    :root {
        --bg: #100e11;
        --bg-soft: #191418;
        --panel: rgba(25, 21, 25, 0.94);
        --panel-light: rgba(39, 29, 32, 0.92);
        --text: #eee5df;
        --muted: #93898d;
        --muted-dark: #6f666c;
        --gold: #d5a65b;
        --gold-light: #e8c58e;
        --violet: #a78bfa;
        --violet-light: #c4b5fd;
        --violet-border: rgba(167, 139, 250, 0.35);
        --border: rgba(255, 255, 255, 0.08);
        --gold-border: rgba(213, 166, 91, 0.38);
        --danger: #e58c8c;
        --danger-border: rgba(229, 140, 140, 0.4);
    }

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: var(--text);
        line-height: 1.6;
        background:
            radial-gradient(
                ellipse at 50% -8%,
                rgba(157, 69, 76, 0.32) 0%,
                rgba(89, 39, 49, 0.26) 28%,
                rgba(35, 24, 30, 0.72) 54%,
                rgba(15, 14, 17, 0.98) 82%
            ),
            linear-gradient(
                180deg,
                #301b22 0%,
                #1d171c 34%,
                #121114 70%,
                #0c0c0e 100%
            );
        background-attachment: fixed;
        padding: 40px 20px;
        position: relative;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
            radial-gradient(
                circle at 12% 20%,
                rgba(183, 91, 78, 0.055),
                transparent 30%
            ),
            radial-gradient(
                circle at 88% 34%,
                rgba(213, 166, 91, 0.035),
                transparent 28%
            );
    }

    a {
        color: inherit;
        -webkit-tap-highlight-color: transparent;
    }

    button,
    input,
    select,
    textarea {
        font: inherit;
    }

    .page {
        position: relative;
        z-index: 1;
        width: 900px;
        max-width: 100%;
        margin: auto;
    }

    /* ===== Верхняя панель ===== */

    .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
    }

    .back {
        color: #a79b9d;
        text-decoration: none;
        font-size: 12px;
        transition: color 0.2s;
    }

    .back:hover {
        color: var(--gold-light);
    }

    .brand {
        color: var(--gold);
        font-family: Georgia, serif;
        letter-spacing: 3px;
        font-size: 11px;
    }

    /* ===== Основная карточка ===== */

    .card {
        background: linear-gradient(
            145deg,
            rgba(41, 29, 33, 0.98),
            rgba(16, 15, 18, 0.99)
        );
        border: 1px solid var(--gold-border);
        border-radius: 18px;
        padding: 35px;
        box-shadow:
            0 35px 90px rgba(0, 0, 0, 0.42),
            0 0 45px rgba(213, 166, 91, 0.06),
            inset 0 1px rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(16px);
        animation: appear 0.55s ease both;
    }

    .header {
        margin-bottom: 30px;
    }

    .header-label {
        color: var(--gold);
        font-size: 9px;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 8px;
    }

    h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 30px;
        font-weight: normal;
        letter-spacing: -0.5px;
        line-height: 1.25;
        color: #f0e5de;
    }

    .description {
        color: var(--muted);
        font-size: 12px;
        margin-top: 9px;
        line-height: 1.7;
    }

    /* ===== Ошибка формы ===== */

    .form-error {
        display: none;
        margin-bottom: 18px;
        padding: 11px 13px;
        background: rgba(240, 168, 168, 0.05);
        border: 1px solid rgba(240, 168, 168, 0.35);
        border-radius: 8px;
        color: #f2b6b6;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.5;
        overflow-wrap: anywhere;
    }

    .form-error.visible {
        display: block;
    }

    /* ===== Сетка контента ===== */

    .content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
    }

    .section {
        background: linear-gradient(
            145deg,
            rgba(32, 26, 29, 0.91),
            rgba(17, 16, 19, 0.96)
        );
        border: 1px solid rgba(255, 255, 255, 0.075);
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(12px);
    }

    .section-title {
        color: var(--gold);
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 20px;
    }

    /* ===== Поля ===== */

    .field {
        margin-bottom: 15px;
    }

    .field:last-child {
        margin-bottom: 0;
    }

    .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #c8bfc0;
        font-size: 10px;
        line-height: 1.5;
    }

    input,
    select,
    textarea {
        width: 100%;
        min-height: 44px;
        padding: 12px 13px;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 9px;
        color: #eee8e3;
        font-size: 12px;
        outline: none;
        transition:
            border-color 0.25s,
            background 0.25s,
            box-shadow 0.25s;
    }

    input::placeholder,
    textarea::placeholder {
        color: #6e666b;
    }

    input:hover,
    select:hover,
    textarea:hover {
        border-color: rgba(255, 255, 255, 0.2);
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: rgba(213, 166, 91, 0.75);
        background: rgba(255, 255, 255, 0.07);
        box-shadow: 0 0 0 3px rgba(213, 166, 91, 0.1);
    }

    textarea {
        min-height: 100px;
        resize: vertical;
        line-height: 1.6;
    }

    /* ===== Action-карточки ===== */

    .account-actions {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .action-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 20px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.075);
        background: linear-gradient(
            145deg,
            rgba(32, 26, 29, 0.91),
            rgba(17, 16, 19, 0.96)
        );
        color: var(--text);
        text-decoration: none;
        backdrop-filter: blur(12px);
        transition:
            transform 0.25s,
            border-color 0.25s,
            background 0.25s;
    }

    .action-card:hover {
        border-color: var(--gold-border);
        background: linear-gradient(
            145deg,
            rgba(43, 31, 34, 0.96),
            rgba(21, 18, 21, 0.98)
        );
        transform: translateY(-3px);
    }

    .action-info strong {
        display: block;
        color: #e5dad6;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 5px;
    }

    .action-info span {
        color: #857b80;
        font-size: 10px;
    }

    .arrow {
        color: var(--gold-light);
        font-size: 18px;
        transition: transform 0.2s;
    }

    .action-card:hover .arrow {
        transform: translateX(3px);
    }

    /* ===== Нижняя панель ===== */

    .bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-top: 28px;
        padding-top: 22px;
        border-top: 1px solid rgba(255, 255, 255, 0.075);
    }

    .cancel {
        color: #a79b9d;
        text-decoration: none;
        font-size: 12px;
        transition: color 0.2s;
    }

    .cancel:hover {
        color: var(--text);
    }

    .bottom-right {
        display: flex;
        gap: 12px;
    }

    .save,
    .delete {
        min-height: 44px;
        padding: 12px 20px;
        border-radius: 9px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition:
            transform 0.22s,
            background 0.22s,
            border-color 0.22s,
            box-shadow 0.22s;
    }

    .save {
        border: 1px solid rgba(213, 166, 91, 0.45);
        background: linear-gradient(
            135deg,
            rgba(111, 67, 49, 0.5),
            rgba(66, 38, 42, 0.8)
        );
        color: var(--gold-light);
        letter-spacing: 0.4px;
    }

    .save:hover {
        transform: translateY(-2px);
        border-color: var(--gold);
        background: linear-gradient(
            135deg,
            rgba(142, 88, 55, 0.56),
            rgba(83, 45, 46, 0.9)
        );
        box-shadow: 0 9px 25px rgba(213, 166, 91, 0.12);
    }

    .delete {
        border: 1px solid var(--danger-border);
        background: rgba(229, 140, 140, 0.06);
        color: var(--danger);
    }

    .delete:hover {
        transform: translateY(-2px);
        border-color: rgba(229, 140, 140, 0.7);
        background: rgba(229, 140, 140, 0.12);
    }

    .save:disabled,
    .delete:disabled {
        opacity: 0.65;
        cursor: wait;
        transform: none;
    }

    /* ===== Анимация ===== */

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(14px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        html {
            scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
            transition-duration: 0.01ms !important;
            animation-duration: 0.01ms !important;
        }
    }

    /* ===== Адаптивность ===== */

    @media (max-width: 700px) {
        .card {
            padding: 25px 18px;
            border-radius: 14px;
        }

        .content,
        .account-actions {
            grid-template-columns: 1fr;
        }

        .account-actions {
            grid-column: auto;
        }

        .row {
            grid-template-columns: 1fr;
        }

        .bottom {
            flex-direction: column;
            gap: 15px;
            align-items: stretch;
        }

        .bottom-right {
            flex-direction: column-reverse;
        }

        .save,
        .delete {
            width: 100%;
        }

        h1 {
            font-size: 26px;
        }
    }
</style>
</head>
<body>
<div class="page">
    <div class="top">
        <a href="/user/my_profile" class="back">← Вернуться в профиль</a>
        <div class="brand">BAR & LOUNGE</div>
    </div>
    <div class="card">
        <div class="header">
            <div class="header-label">PROFILE SETTINGS</div>
            <h1>Настройки профиля</h1>
            <div class="description">Изменение личных данных и настроек аккаунта</div>
        </div>
        <form id="profileForm">
            <div id="formError" class="form-error"></div>
            <div class="content">
                <div class="section">
                    <div class="section-title">ЛИЧНЫЕ ДАННЫЕ</div>
                    <div class="row">
                        <div class="field">
                            <label>Имя</label>
                            <input type="text" name="name" value="{{ user.name }}">
                        </div>
                        <div class="field">
                            <label>Фамилия</label>
                            <input type="text" name="surname" value="{{ user.surname }}">
                        </div>
                    </div>
                    <div class="field">
                        <label>Email</label>
                        <input type="email" name="email" value="{{ user.email }}">
                    </div>
                    <div class="field">
                        <label>Номер телефона</label>
                        <input type="tel" name="phone" value="{{ user.phone }}">
                    </div>
                    <div class="field">
                        <label>Дата рождения</label>
                        <input type="date" name="birthday" value="{{ user.birthday }}">
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">АДРЕС</div>
                    <div class="field">
                        <label>Город</label>
                        <input type="text" name="city" value="{{ address.city }}">
                    </div>
                    <div class="field">
                        <label>Почтовый индекс</label>
                        <input type="text" name="postal_code" value="{{ address.postal_code }}">
                    </div>
                    <div class="field">
                        <label>Улица</label>
                        <input type="text" name="street" value="{{ address.street }}">
                    </div>
                    <div class="row">
                        <div class="field">
                            <label>Дом</label>
                            <input type="text" name="house" value="{{ address.house }}">
                        </div>
                        <div class="field">
                            <label>Квартира</label>
                            <input type="text" name="apartment" value="{{ address.apartment }}">
                        </div>
                    </div>
                </div>
                <div class="account-actions">
                    <a href="/user/password" class="action-card">
                        <div class="action-info">
                            <strong>Изменить пароль</strong>
                            <span>Обновить пароль аккаунта</span>
                        </div>
                        <div class="arrow">→</div>
                    </a>
                    <a href="/profile/account" class="action-card">
                        <div class="action-info">
                            <strong>Банковские данные</strong>
                            <span>Добавить или изменить данные счета</span>
                        </div>
                        <div class="arrow">→</div>
                    </a>
                </div>
            </div>
            <div class="bottom">
                <a href="/user/my_profile" class="cancel">Отмена</a>
                <div class="bottom-right">
                    <button type="button" class="delete" onclick="deleteAccount()">Удалить аккаунт</button>
                    <button type="submit" class="save">Сохранить изменения</button>
                </div>
            </div>
        </form>
    </div>
</div>
<script src="/static/api.js"></script>
<script>
    const form = document.getElementById("profileForm");
    const formError = document.getElementById("formError");

function showFormError(message) {
    formError.textContent = message;
    formError.classList.add("visible");
}

function clearFormError() {
    formError.textContent = "";
    formError.classList.remove("visible");
}

function clearError(input) {
    input.style.borderColor = "";
    const error = input.parentElement.querySelector(".field-error");
    if (error) error.remove();
}

function showError(input, message) {
    clearError(input);
    input.style.borderColor = "#d98282";
    const error = document.createElement("div");
    error.className = "field-error";
    error.textContent = message;
    error.style.color = "#d98282";
    error.style.fontSize = "11px";
    error.style.marginTop = "5px";
    input.parentElement.appendChild(error);
}

function clearAllErrors() {
    form.querySelectorAll(".field-error").forEach(error => error.remove());
    form.querySelectorAll("input").forEach(input => input.style.borderColor = "");
    clearFormError();
}

async function handleFieldErrors(response) {
    try {
        const data = await response.json();

        if (Array.isArray(data.detail)) {
            const generalErrors = [];

            data.detail.forEach(error => {
                const field = error.loc?.at(-1);
                const input = field ? form.querySelector(`[name="${field}"]`) : null;

                if (input) {
                    showError(input, error.msg || "Некорректное значение.");
                } else if (error.msg) {
                    generalErrors.push(error.msg);
                }
            });

            if (generalErrors.length) {
                showFormError(generalErrors.join(", "));
            }
            return;
        }

        showFormError(data.detail || data.message || "Произошла ошибка.");
    } catch {
        showFormError("Произошла ошибка.");
    }
}

async function handleResponse(response) {
    if (response.ok) return true;

    if (response.status === 422 || response.status === 409) {
        await handleFieldErrors(response);
        return false;
    }

    if (response.status === 401) {
        window.location.href = "/login";
        return false;
    }

    if (response.status === 403) {
        showFormError("У вас нет доступа к этому действию.");
        return false;
    }

    if (response.status === 404) {
        showFormError("Данные не найдены.");
        return false;
    }

    if (response.status >= 500) {
        showFormError("Ошибка сервера. Попробуйте позже.");
        return false;
    }

    try {
        const data = await response.json();
        showFormError(data.detail || data.message || "Произошла ошибка.");
    } catch {
        showFormError("Произошла ошибка.");
    }

    return false;
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();
    clearAllErrors();

    try {
        const response = await apiFetch("/user/edit", {
            method: "PATCH",
            body: new FormData(form)
        });

        if (!await handleResponse(response)) return;

        window.location.href = "/user/my_profile";
    } catch {
        showFormError("Не удалось подключиться к серверу. Проверьте соединение.");
    }
});

async function deleteAccount() {
    clearFormError();

    if (!confirm("Вы действительно хотите удалить аккаунт?")) return;

    try {
        const response = await apiFetch("/user/delete", {
            method: "DELETE"
        });

        if (!await handleResponse(response)) return;

        window.location.href = "/bar_name";
    } catch {
        showFormError("Не удалось подключиться к серверу. Проверьте соединение.");
    }
}

</script>
</body>
</html>
