services:
  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - authentication-service
      - user-service

  authentication-service:
    build:
      context: ./authentication_service

    container_name: authentication-service

    ports:
      - "8000:8000"
    env_file:
      - ./authentication_service/.env
    volumes:
      - ./authentication_service:/authentication_service
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  user-service:
    build:
      context: ./user_service

    container_name: user-service

    ports:
      - "8005:8005"
    env_file:
      - ./user_service/.env
    volumes:
      - ./user_service:/user_service
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8005"
      - --reload
  db-authentication:
    image: postgres:16
    container_name: db-authentication
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authentication_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
  db-user:
    image: postgres:16
    container_name: db-user
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
volumes:
  postgres_auth_data:
  postgres_user_data: